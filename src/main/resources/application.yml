spring:
  application:
    name: ride-fleet
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ride_fleet_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

ridefleet:
  # Tarifacao usada para estimar preco e ETA na criacao da corrida e nas
  # propostas de leilao enviadas ao Core.
  fare:
    base-fare: 5.00
    per-km: 2.50
    per-minute: 0.50
    minimum-fare: 8.00
    average-speed-kmh: 30.0

  # Politica de overflow: quando o servico se considera congestionado e deve
  # delegar corridas. Qualquer sinal verdadeiro dispara.
  overflow:
    enabled: true
    pending-rides-threshold: 5
    average-latency-threshold-ms: 800
    latency-window: 30s
    # nao julga latencia com menos amostras que isso, para nao delegar por
    # causa de uma unica requisicao de cold start
    latency-window-min-samples: 10
    latency-window-capacity: 512

  # Administrador inicial. A senha fica vazia de proposito: o seed gera uma
  # aleatoria e a registra uma vez em WARN, em vez de versionar credencial fixa.
  # Em Docker Compose, definir ADMIN_PASSWORD por variavel de ambiente.
  admin:
    seed-enabled: true
    name: Administrador RideFleet
    email: ${ADMIN_EMAIL:admin@ridefleet.local}
    password: ${ADMIN_PASSWORD:}
