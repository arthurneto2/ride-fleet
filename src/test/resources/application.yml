spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

ridefleet:
  # Nos testes cada classe cria seu proprio administrador, entao o seed fica
  # desligado para nao deixar linha residual entre classes.
  admin:
    seed-enabled: false

# Valores fixos de teste. Necessarios aqui porque src/test/resources/application.yml
# substitui integralmente o arquivo principal: chave declarada so em producao nao
# existe nos testes. SecurityAndAuthIntegrationTests depende desta chave do Core.
security:
  jwt:
    secret: segredo-de-teste-com-tamanho-suficiente-1234567890
  core:
    api-key: core-shared-secret-key-123
