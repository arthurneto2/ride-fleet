spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

ridefleet:
  # Nos testes cada classe cria seu proprio administrador, entao o seed fica
  # desligado para nao deixar linha residual entre classes.
  admin:
    seed-enabled: false
